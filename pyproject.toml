[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viclix"
version = "0.1.80"
description = "Official Viclix CLI — deploy and manage Viclix projects from your terminal."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Sizth, LLC" }]
keywords = ["viclix", "deploy", "cli", "paas"]
dependencies = [
    "requests>=2.20",
    "questionary>=1.10",
    "textual>=0.60",
]

[project.optional-dependencies]
# `viclix say` — Edge TTS speech. Kept optional so the core install stays lean:
#   pip install "viclix[say]"
say = [
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "miniaudio>=1.59",
]
# `viclix listen` — Whisper voice dictation. CPU works out of the box; for GPU
# also: pip install nvidia-cublas-cu12 nvidia-cudnn-cu12
#   pip install "viclix[voice]"
voice = [
    "faster-whisper>=1.0.0",
    "webrtcvad-wheels>=2.0.14",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pyperclip>=1.8.2",
]
# `viclix listen` with GPU — same as [voice] plus the NVIDIA CUDA runtime wheels
# (cuDNN 9 / cuBLAS 12). Without these, listen still works on CPU.
#   pip install "viclix[voice-gpu]"
voice-gpu = [
    "faster-whisper>=1.0.0",
    "webrtcvad-wheels>=2.0.14",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pyperclip>=1.8.2",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9",
]

[project.urls]
Homepage = "https://viclix.com"
Dashboard = "https://dashboard.viclix.com"

[project.scripts]
viclix = "viclix.cli:main"

[tool.setuptools]
packages = ["viclix", "viclix.commands"]
